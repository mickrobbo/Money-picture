<style>
/* Layout: one narrow phone column, quiet ledger cards, fixed bottom tab bar; summary first, detail below. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#e8ecea; --line:#dbe1de;
  --ink:#17201d; --muted:#5b6964; --accent:#1d5a86; --accent-soft:#e1ebf3;
  --good:#1d7a4b; --good-soft:#e2f2e9; --bad:#b0412a; --bad-soft:#f8e6e1;
  --ess:#647892; --oth:#c4862a; --in:#1d5a86; --inv:#2e8a84;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px; --h:40px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --sunk:#202925; --line:#2a3430;
  --ink:#e6ebe9; --muted:#97a6a0; --accent:#74b2e2; --accent-soft:#1b2b37;
  --good:#52c48d; --good-soft:#173027; --bad:#f07f66; --bad-soft:#3a201a;
  --ess:#90a4c0; --oth:#e0a64c; --in:#74b2e2; --inv:#5cc2ba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --sunk:#202925; --line:#2a3430;
  --ink:#e6ebe9; --muted:#97a6a0; --accent:#74b2e2; --accent-soft:#1b2b37;
  --good:#52c48d; --good-soft:#173027; --bad:#f07f66; --bad-soft:#3a201a;
  --ess:#90a4c0; --oth:#e0a64c; --in:#74b2e2; --inv:#5cc2ba; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap.noNav{padding-bottom:24px}
.num,.big,td,.io-v,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
h1{font-size:17px;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:14px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--h)}
.top .brand{display:flex;align-items:center;gap:8px}
.mark{width:24px;height:24px;flex:none;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--h)}
.cap{font-size:12.5px;color:var(--muted)}
.btn{height:var(--h);min-width:var(--h);padding:0 14px;border-radius:10px;border:1px solid transparent;font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--accent);color:var(--surface);white-space:nowrap;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}

.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible,.link-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 0}
.hero{display:flex;flex-direction:column;gap:4px;padding:6px 2px 2px}

.hero-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}

.note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.note.warn{background:var(--bad-soft)}
.note p{min-width:0}
svg.chart{width:100%;height:auto;display:block;overflow:visible}

.io{display:flex;flex-direction:column;gap:8px}
.io-row{display:grid;grid-template-columns:68px 1fr 86px;align-items:center;gap:10px}
.io-l{font-size:13px;color:var(--muted)}
.io-track{height:14px;background:var(--sunk);border-radius:4px;display:flex;overflow:hidden}
.seg{display:block;height:100%}
.seg.in{background:var(--in)} .seg.ess{background:var(--ess)} .seg.oth{background:var(--oth)} .seg.inv{background:var(--inv)}
.io-v{text-align:right;font-size:14px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.inv{background:var(--inv)} .sw.in{background:var(--in)} .sw.ess{background:var(--ess)} .sw.oth{background:var(--oth)} .sw.good{background:var(--good)} .sw.bad{background:var(--bad)}
.leftover{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.leftover b{font-size:20px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.link-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.link-row:first-child{border-top:0}
.link-row .t{font-weight:600}
.link-row .v{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.link-row .s{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12.5px;color:var(--muted)}
.kv .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.line:first-child{border-top:0}
.line .amt{text-align:right;font-weight:600}
.line.total{font-weight:700}
.line .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.grp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:10px;display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:600;margin-left:6px;vertical-align:1px}
.chip.up{background:var(--bad-soft);color:var(--bad)} .chip.down{background:var(--good-soft);color:var(--good)} .chip.top{background:var(--accent-soft);color:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:92px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{position:relative;height:12px;background:var(--sunk);border-radius:4px}
.hb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.hb .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.hb .amt{text-align:right;font-weight:600}
.tbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left;padding-left:0;position:sticky;left:0;background:var(--surface)}
tr.tot td{font-weight:700}
.monthnav{display:grid;grid-template-columns:var(--h) 1fr var(--h);gap:8px;align-items:center}
.monthnav .lbl{text-align:center;font-weight:650}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:4px}
.debt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.debt:first-of-type{border-top:0;padding-top:0}
.debt .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.debt .bal{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.billrows{display:flex;flex-direction:column}.billrows .link-row{padding:10px 0}
.v.muted{color:var(--muted);font-weight:500}
/* forms */
.field{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;padding:6px 0}
.field label{font-size:14px;min-width:0}
.field label small{display:block;font-size:12px;color:var(--muted)}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
input[type=text],input[type=number],select,textarea{width:100%;height:var(--h);border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 10px}
.money-in input{text-align:right;padding-left:22px;font-variant-numeric:tabular-nums}
.pct-in{position:relative}.pct-in::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}.pct-in input{text-align:right;padding-right:26px}
.num-in input{text-align:right}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.compare>div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.compare .k{font-size:12.5px;color:var(--muted)}
.compare .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.compare .win{outline:2px solid var(--good);outline-offset:-2px}
textarea{height:110px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical}
.formsec{display:flex;flex-direction:column}
.formsec h2{padding:4px 0 6px}
.savebar{position:sticky;bottom:0;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:5}
.savebar .btn{flex:1 1 0}
.cat-row{display:grid;grid-template-columns:1fr auto var(--h);gap:8px;align-items:center;padding:4px 0}
.switch{display:inline-flex;align-items:center;gap:8px;height:var(--h);font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.filebtn{position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:20}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{height:56px;border:0;background:none;font:inherit;font-size:11px;letter-spacing:-.01em;white-space:nowrap;padding:0 2px;min-width:0;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

<script>
(function(){
"use strict";
var KEY='moneyPicture.v1';
var FIELDS=['pay','otherIn','home','super','propValue','propLoan','rent','propCosts','emergency','td','other','crypto','cryptoIn'];
var S, storageOK=true, view='home', flowMonth=null, pendingImport=null, csvOut='';
var armed={};

/* ---------- formatting & dates (Melbourne) ---------- */
var AUD=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0,minimumFractionDigits:0});
function n(v){v=+v;return isFinite(v)?v:0}
function money(v){return AUD.format(Math.round(n(v))).replace('-','−')}
function signed(v){v=Math.round(n(v));return (v>0?'+':v<0?'−':'')+AUD.format(Math.abs(v))}
function short(v){var a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(2).replace(/\.?0+$/,'')+'m';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'k';return s+'$'+Math.round(a)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function melToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function curMonth(){return melToday().slice(0,7)}
function ym(k){var p=k.split('-');return [+p[0],+p[1]]}
function dn(iso){var p=iso.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]||1)/864e5}
function fromDn(d){return new Date(d*864e5).toISOString().slice(0,10)}
function addDays(iso,d){return fromDn(dn(iso)+d)}
function payAnchor(){return (S&&S.payDay)||'2026-11-04'}
function curPayDate(){var a=dn(payAnchor()),t=dn(melToday());return fromDn(a+Math.floor((t-a)/14)*14)}
function pRange(k){var a=dn(k),o={timeZone:'UTC',day:'numeric',month:'short'},d0=new Date(a*864e5),d1=new Date((a+13)*864e5);
  return d0.toLocaleDateString('en-AU',o)+' \u2013 '+d1.toLocaleDateString('en-AU',Object.assign({year:'numeric'},o))}
function mLabel(k,long){if(k.length===10)return dLabel(k);var a=ym(k);return new Date(Date.UTC(a[0],a[1]-1,15)).toLocaleDateString('en-AU',{timeZone:'UTC',month:long?'long':'short',year:'numeric'})}
function mShort(k){if(k.length===10)return new Date(dn(k)*864e5).toLocaleDateString('en-AU',{timeZone:'UTC',day:'numeric',month:'short'});var a=ym(k);return new Date(Date.UTC(a[0],a[1]-1,15)).toLocaleDateString('en-AU',{timeZone:'UTC',month:'short'})}
function addMonth(k,d){var a=ym(k),y=a[0],m=a[1]+d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+(m<10?'0':'')+m}
function dLabel(iso){if(!iso)return '';var p=iso.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]||1)).toLocaleDateString('en-AU',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'})}
function durLabel(m){m=Math.ceil(m);var y=Math.floor(m/12),r=m%12;if(y&&r)return y+' yr '+r+' mth';if(y)return y+(y>1?' yrs':' yr');return r+(r===1?' month':' months')}
function parseMoney(s){s=String(s||'').replace(/[$,\s]/g,'');if(s==='')return 0;var v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:0}

/* ---------- state ---------- */
function defaultCats(){return [
  {id:'groceries',name:'Groceries',ess:true},{id:'utilities',name:'Utilities',ess:true},{id:'fuel',name:'Fuel',ess:true},
  {id:'kids',name:'Kids',ess:true},{id:'eatingout',name:'Eating out',ess:false},{id:'hobbies',name:'Hobbies',ess:false},{id:'other',name:'Other',ess:false}]}

function blankState(){return {v:2,payDay:'2026-11-04',example:false,superFortnight:0,extraPay:0,budget:{},goal:null,cats:defaultCats(),debts:[],accounts:[],places:defaultPlaces(),bills:[],billTx:[],months:{},lastBackup:null}}
function exampleState(){
  var st=blankState();st.example=true;st.superFortnight=1150;
  st.extraPay=200;st.cryptoBefore=4000;st.goal={name:'Emergency buffer',target:30000,by:addMonth(curMonth(),12)};var T0=melToday();st.bills=[{id:'pb1',name:'Water',pay:45,every:'quarter',place:'property'},{id:'pb2',name:'Council rates',pay:75,every:'quarter',place:'property'},{id:'pb3',name:'Landlord insurance',pay:65,every:'year',place:'property'},
    {id:'pb4',name:'Electricity',pay:90,every:'quarter',place:'nicoles'},{id:'pb5',name:'Gas',pay:40,every:'quarter',place:'nicoles'},{id:'pb6',name:'Internet',pay:0,every:'month',place:'nicoles'}];
  st.billTx=[['pb1',-275,'bill',305,140],['pb1',-184,'bill',284,null],['pb1',-93,'bill',318,null],['pb1',-2,'bill',296,186],
    ['pb2',-222,'bill',531,90],['pb2',-131,'bill',548,null],['pb2',-40,'bill',548,null],['pb3',-200,'bill',1690,0],

function payoff(bal,rate,min){
  bal=n(bal);min=n(min);if(bal<=0)return 'Paid off';if(min<=0)return 'Set a minimum repayment to see a payoff date';
  var r=n(rate)/1200;if(r>0&&min<=bal*r)return 'The minimum repayment doesn’t cover the interest';
  var mths=r>0?-Math.log(1-r*bal/min)/Math.log(1+r):bal/min;return 'Gone in about '+durLabel(mths)+' at minimum repayments';
}

/* ---------- budget, saving goal, payoff plan ---------- */
function r10(v){return Math.round(v/10)*10}
function avgOf(ks,fn){if(!ks.length)return 0;var t=0;ks.forEach(function(k){t+=fn(S.months[k])});return t/ks.length}
function suggestBudget(){var ks=keys().slice(-3);if(ks.length<3)return null;var b={};
  S.cats.forEach(function(c){var a=avgOf(ks,function(m){return n((m.spend||{})[c.id])});b[c.id]=c.ess?r10(a):r10(a*0.85)});return b}
function hasBudget(){return S.cats.some(function(c){return n(S.budget[c.id])>0})}
function budgetFrees(){var ks=keys().slice(-3),t=0;if(!ks.length||!hasBudget())return 0;
  S.cats.forEach(function(c){var a=avgOf(ks,function(m){return n((m.spend||{})[c.id])}),b=n(S.budget[c.id]);if(b>0&&a>b)t+=a-b});return t}
function budgetCard(k){
  var sp=S.months[k].spend||{},sug=suggestBudget(),have=keys().length;
  if(!hasBudget()){
    if(!sug)return '<section class="card"><h2>Budget</h2><p class="small muted">After three fortnights of updates this suggests a budget from your real spending. You have '+have+' so far.</p></section>';
    var ks=keys().slice(-3),tA=0,tS=0,rows=S.cats.map(function(c){var a=avgOf(ks,function(m){return n((m.spend||{})[c.id])});tA+=a;tS+=sug[c.id];
      return '<tr><td>'+esc(c.name)+'</td><td>'+money(a)+'</td><td><b>'+money(sug[c.id])+'</b></td></tr>'}).join('');
    return '<section class="card"><h2>Suggested budget</h2><p class="small muted">Built from your last three fortnights. Essentials stay at your average. Everything else is trimmed by 15%, which frees about <b>'+money(tA-tS)+'</b> a fortnight.</p>'+
      '<div class="tbl"><table><thead><tr><th>Category</th><th>Usual</th><th>Budget</th></tr></thead><tbody>'+rows+'<tr class="tot"><td>Total</td><td>'+money(tA)+'</td><td>'+money(tS)+'</td></tr></tbody></table></div>'+
      '<div class="btn-row"><button class="btn ghost" data-act="edit-budget">Adjust</button><button class="btn" data-act="use-budget">Use this budget</button></div></section>';
  }
  var tb=0,tsp=0,over=[],bars=S.cats.map(function(c){var b=n(S.budget[c.id]),v=n(sp[c.id]);tb+=b;tsp+=v;if(b>0&&v>b)over.push(c.name);
    var mx=Math.max(b,v,1),col=b>0&&v>b?'var(--bad)':'var(--'+(c.ess?'ess':'oth')+')';
    return '<div class="hb"><span class="nm">'+esc(c.name)+'</span><div class="tr"><i class="fill" style="width:'+(v/mx*100).toFixed(1)+'%;background:'+col+'"></i>'+(b>0?'<i class="tick" style="left:calc('+(b/mx*100).toFixed(1)+'% - 1px)"></i>':'')+'</div><span class="amt">'+money(v)+'<br><span class="muted" style="font-weight:400;font-size:11.5px">of '+money(b)+'</span></span></div>'}).join('');
  var msg=over.length?'Over budget on '+esc(over.join(', '))+'.':'Inside budget on every category.';
  return '<section class="card"><div class="row-h"><h2>Budget</h2><span class="pill '+(tsp>tb?'bad':'good')+'">'+money(tsp)+' of '+money(tb)+'</span></div><p class="small muted">'+msg+' The tick is your budget.</p><div class="hbars">'+bars+'</div>'+
    '<div class="btn-row"><button class="btn ghost" data-act="edit-budget">Edit budget</button>'+(sug?'<button class="btn ghost" data-act="use-budget">Re-suggest</button>':'')+'</div></section>';
}
function goalCard(){
  var ks=keys();if(!ks.length)return '';var c=calc(ks[ks.length-1]),g=S.goal;
  if(!g||!n(g.target))return '<section class="card"><div class="row-h"><h2>Savings goal</h2><button class="btn ghost" data-act="edit-goal">Set one</button></div><p class="small muted">Pick an amount and a month to reach it by. It tracks your emergency fund and term deposits together and shows what you need to put away.</p></section>';
  var cur=c.savings,pct=Math.min(100,cur/n(g.target)*100),left=Math.max(1,Math.floor((dn((g.by||curMonth())+'-01')-dn(ks[ks.length-1]))/14));
  var need=Math.max(0,(n(g.target)-cur)/left);
  var l3=ks.slice(-3),al=0;l3.forEach(function(k){al+=calc(k).left});al=al/l3.length;var fr=budgetFrees();
  var status;if(cur>=n(g.target))status='<span class="pill good">Reached</span>';else if(al>=need)status='<span class="pill good">On track</span>';else status='<span class="pill bad">Short '+money(need-Math.max(0,al))+' a fortnight</span>';
  var tip=cur>=n(g.target)?'Goal reached. Set a new one when you’re ready.':
    'You need about <b>'+money(need)+'</b> a fortnight until '+mLabel(g.by,true)+'. Lately you’ve had <b>'+signed(al)+'</b> left over a fortnight.'+
    (al<need?(fr?' Sticking to your budget frees about <b>'+money(fr)+'</b> a fortnight'+(Math.max(0,al)+fr>=need?', which would get you there.':'. A later date or a smaller goal would close the rest.'):' A budget from your real spending can show where it could come from.'):'')+
    ' Move it into savings on payday so it’s gone before it can leak.';
  return '<section class="card"><div class="row-h"><h2>'+esc(g.name||'Savings goal')+'</h2>'+status+'</div>'+
    '<div class="hd" style="display:flex;justify-content:space-between;gap:10px"><span class="bal" style="font-size:18px;font-weight:700">'+money(cur)+'</span><span class="small muted">of '+money(g.target)+' by '+mLabel(g.by)+'</span></div>'+
    '<div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div><p class="small muted">'+tip+'</p><button class="btn ghost" data-act="edit-goal">Edit goal</button></section>';
}
function simulate(list,extra,mode){
  var ds=list.filter(function(d){return d.bal>0}).map(function(d){return {id:d.id,name:d.name,bal:d.bal,rate:d.rate,min:d.min}});
  var rank={};ds.slice().sort(mode==='small'?function(a,b){return a.bal-b.bal||b.rate-a.rate}:function(a,b){return b.rate-a.rate||a.bal-b.bal}).forEach(function(d,i){rank[d.id]=i});
  var interest=0,m=0,order=[],done={};
  while(ds.some(function(d){return d.bal>0.005})&&m<600){m++;var pool=mode?extra:0;
    ds.forEach(function(d){if(d.bal<=0.005){if(mode)pool+=d.min;return}var i=d.bal*d.rate/1200;interest+=i;d.bal+=i;var p=Math.min(d.bal,d.min);d.bal-=p;if(mode)pool+=d.min-p});
    if(mode){ds.filter(function(d){return d.bal>0.005}).sort(function(a,b){return rank[a.id]-rank[b.id]}).forEach(function(d){if(pool<=0)return;var p=Math.min(pool,d.bal);d.bal-=p;pool-=p})}
    ds.forEach(function(d){if(d.bal<=0.005&&!done[d.id]){done[d.id]=m;order.push({name:d.name,month:m});d.bal=0}})}
  return {months:m,interest:interest,order:order,stuck:ds.some(function(d){return d.bal>0.005})};
}
function planCard(k,dd){
  var list=S.debts.filter(function(d){return d.plan!==false&&n(dd[d.id])>0}).map(function(d){return {id:d.id,name:d.name,bal:n(dd[d.id]),rate:n(d.rate),min:n(d.min)}});
  var ex=n(S.extraPay),field='<div class="field"><label for="planExtra">Extra you can put in each fortnight<small>On top of the minimums</small></label><div class="money-in"><input type="text" inputmode="decimal" id="planExtra" value="'+(ex||'')+'" placeholder="0"></div></div>';
  if(!list.length)return '<section class="card"><h2>Best way to pay it down</h2><p class="empty">No debts in the plan. Tick “Include in the payoff plan” when you edit a debt.</p></section>';
  var exM=ex*26/12,base=simulate(list,0,null),av=simulate(list,exM,'rate'),sn=simulate(list,exM,'small'),start=curMonth();
  var when=function(r){return r.stuck?'not on these numbers':mLabel(addMonth(start,r.months))};
  var row=function(t,r,chip){return '<div class="line"><span>'+t+(chip||'')+'</span><span class="amt">'+money(r.interest)+'</span><span class="sub">Debt-free '+when(r)+(r.stuck?'':' ('+durLabel(r.months)+')')+' · interest paid shown right</span></div>'};
  var first=av.order.length?av.order[0].name:list[0].name,top=list.slice().sort(function(a,b){return b.rate-a.rate})[0];
  var saved=base.interest-av.interest,diff=av.interest-sn.interest;
  var head='<p><b>Put every spare dollar on '+esc(top.name)+' first</b> ('+top.rate+'% interest). Keep paying the minimums on the rest. When it’s gone, roll its repayment onto the next highest rate.</p>';
  var why=sn.order.length&&av.order.length&&sn.order[0].name!==av.order[0].name&&Math.abs(diff)<150?' Clearing '+esc(sn.order[0].name)+' first costs only '+money(Math.abs(diff))+' more and gives you a quicker win, if that keeps you going.':'';
  var timeline=av.order.map(function(o,i){return '<div class="line"><span>'+(i+1)+'. '+esc(o.name)+'</span><span class="amt">'+mLabel(addMonth(start,o.month))+'</span></div>'}).join('');
  return '<section class="card"><h2>Best way to pay it down</h2>'+field+head+
    '<p class="small muted">Compared with minimums only, this saves about <b>'+money(Math.max(0,saved))+'</b> in interest'+(base.stuck||av.stuck?'':' and you’re debt-free '+durLabel(Math.max(0,base.months-av.months))+' sooner')+'.'+why+'</p>'+
    '<div class="grp">Order and payoff month</div><div class="lines">'+timeline+'</div>'+
    '<div class="grp">Compare</div><div class="lines">'+row('Highest interest first',av,'<span class="chip top">best</span>')+row('Smallest balance first',sn)+row('Minimums only',base)+'</div>'+

  var tx=S.billTx.filter(function(t){return t.bill===b.id}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:n(x.seq)-n(y.seq)});
  tx.forEach(function(t){
    if(known&&last&&pay){var k=paydaysBetween(last,t.date);if(k){bal+=k*pay;rows.push({auto:true,date:t.date,k:k,amt:k*pay,bal:bal,known:true})}}
    if(t.kind==='bill')bal-=n(t.amt);else if(t.kind==='paid')bal+=n(t.amt);

    rows.push({t:t,bal:bal,known:known});last=t.date});
  if(known&&last&&pay){var k2=paydaysBetween(last,today);if(k2){bal+=k2*pay;rows.push({auto:true,date:today,k:k2,amt:k2*pay,bal:bal,known:true})}}
  var bills=tx.filter(function(t){return t.kind==='bill'}),lastBill=bills.length?bills[bills.length-1]:null;
  var per=(EVERY[b.every]||EVERY.quarter)[1],need=lastBill?n(lastBill.amt)*per/26:0,yr=addDays(today,-365),yrBills=0;
  bills.forEach(function(t){if(t.date>yr)yrBills+=n(t.amt)});

function sellKeepCard(c,m,last){

  var loan=n(m.propLoan),sale=opt(sk,'sale',n(m.propValue)),pct=opt(sk,'pct',2.5),g=opt(sk,'growth',4),r=opt(sk,'rate',6.2),park=opt(sk,'park',4.5);

    '<div class="grp">One year from now</div>'+

    inField('sk-rep','Loan repayments a fortnight','Estimated from your loan going down',Math.round(rep))+inField('sk-park','Interest on parked cash','Savings or term deposit, per year',park,'pct-in')+

/* ---------- CSV backup ---------- */
function cell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(){
  var r=[['section','id','field','value'],['setting','','superFortnight',n(S.superFortnight)],['setting','','payDay',payAnchor()],['setting','','extraPay',n(S.extraPay)],['setting','','cryptoBefore',n(S.cryptoBefore)]];
  [['sk',S.sk],['superProj',S.superProj]].forEach(function(p){if(p[1])Object.keys(p[1]).forEach(function(f){if(p[1][f]!=null)r.push([p[0],'',f,p[1][f]])})});
  Object.keys(S.budget||{}).forEach(function(id){r.push(['budget',id,'amount',n(S.budget[id])])});
  if(S.goal)['name','target','by'].forEach(function(f){r.push(['goal','',f,S.goal[f]])});
  S.accounts.forEach(function(a){r.push(['acct',a.id,'name',a.name])});
  S.places.forEach(function(pl){r.push(['place',pl.id,'name',pl.name])});
  S.bills.forEach(function(b){['name','pay','every','place'].forEach(function(f){r.push(['bill',b.id,f,b[f]])})});
  S.billTx.forEach(function(x){['bill','date','kind','amt','bal','seq'].forEach(function(f){if(x[f]!=null&&x[f]!=='')r.push(['billtx',x.id,f,x[f]])})});
  S.cats.forEach(function(c){r.push(['cat',c.id,'name',c.name],['cat',c.id,'ess',c.ess?1:0])});
  S.debts.forEach(function(d){['name','rate','min','start'].forEach(function(f){r.push(['debt',d.id,f,d[f]])});r.push(['debt',d.id,'plan',d.plan===false?0:1])});
  keys().forEach(function(k){var m=S.months[k];FIELDS.forEach(function(f){r.push(['month',k,f,n(m[f])])});r.push(['month',k,'updated',m.updated||'']);
    Object.keys(m.acct||{}).forEach(function(id){r.push(['month',k,'acct.'+id,n(m.acct[id])])});
    Object.keys(m.debt||{}).forEach(function(id){r.push(['month',k,'debt.'+id,n(m.debt[id])])});
    Object.keys(m.spend||{}).forEach(function(id){r.push(['month',k,'spend.'+id,n(m.spend[id])])})});
  return r.map(function(x){return x.map(cell).join(',')}).join('\n');
}
function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(function(r){return r.length>1||r[0]!==''})}
function fromCSV(t){
  var rows=parseCSV(t.replace(/^﻿/,''));if(!rows.length||rows[0][0].trim()!=='section')throw new Error('This doesn’t look like a Money Picture backup.');
  var st=blankState();st.cats=[];var cats={},dbs={};
  rows.slice(1).forEach(function(r){var sec=r[0],id=r[1],f=r[2],v=r[3];
    if(sec==='setting'){st[f]=f==='payDay'?v:n(v)}
    else if(sec==='cat'){if(!cats[id]){cats[id]={id:id,name:id,ess:false};st.cats.push(cats[id])}if(f==='name')cats[id].name=v;else if(f==='ess')cats[id].ess=v==='1'}
    else if(sec==='debt'){if(!dbs[id]){dbs[id]={id:id,name:id,rate:0,min:0,start:0};st.debts.push(dbs[id])}dbs[id][f]=f==='name'?v:f==='plan'?v!=='0':n(v)}
    else if(sec==='place'){if(!st._pl){st._pl=1;st.places=[]}var po=st.places.filter(function(x){return x.id===id})[0];if(!po)st.places.push({id:id,name:v});else po.name=v}
    else if(sec==='bill'){var bo=st.bills.filter(function(x){return x.id===id})[0];if(!bo){bo={id:id,name:id,pay:0,every:'quarter'};st.bills.push(bo)}bo[f]=f==='pay'?n(v):v}
    else if(sec==='billtx'){var to=st.billTx.filter(function(x){return x.id===id})[0];if(!to){to={id:id,bal:null};st.billTx.push(to)}to[f]=(f==='amt'||f==='bal'||f==='seq')?n(v):v}
    else if(sec==='sk'||sec==='superProj'){st[sec]=st[sec]||{};st[sec][f]=n(v)}
    else if(sec==='budget'){st.budget[id]=n(v)}
    else if(sec==='goal'){st.goal=st.goal||{};st.goal[f]=f==='target'?n(v):v}
    else if(sec==='acct'){var ex=st.accounts.filter(function(a){return a.id===id})[0];if(!ex)st.accounts.push({id:id,name:v});else ex.name=v}
    else if(sec==='month'){if(!/^\d{4}-\d{2}(-\d{2})?$/.test(id))return;var m=st.months[id]||(st.months[id]={acct:{},debt:{},spend:{}});
      if(f.indexOf('acct.')===0)m.acct[f.slice(5)]=n(v);else if(f.indexOf('debt.')===0)m.debt[f.slice(5)]=n(v);else if(f.indexOf('spend.')===0)m.spend[f.slice(6)]=n(v);else if(f==='updated')m.updated=v;else if(FIELDS.indexOf(f)>-1)m[f]=n(v)}});
  delete st._pl;st.bills.forEach(function(b){if(!b.place)b.place='property'});if(!st.cats.length)st.cats=defaultCats();st.lastBackup=S.lastBackup;migrate(st);return st;
}

  if(t.id==='payDay'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.payDay=t.value;save();render()}return}
  if(t.id==='planExtra'){S.extraPay=parseMoney(t.value);save();render();return}
  if(t.id==='superF'){S.superFortnight=parseMoney(t.value);save();render();return}
  if(t.id==='importFile'&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{pendingImport=fromCSV(String(rd.result));render()}catch(err){toast(err.message||'Couldn’t read that file')}};rd.readAsText(t.files[0]);return}
  var plid=t.getAttribute('data-place-name');if(plid){var plo=S.places.filter(function(x){return x.id===plid})[0];if(plo&&t.value.trim()){plo.name=t.value.trim();save()}return}
  var cid=t.getAttribute('data-cat-name');if(cid){var c=S.cats.filter(function(x){return x.id===cid})[0];if(c&&t.value.trim()){c.name=t.value.trim();save()}return}
  var eid=t.getAttribute('data-cat-ess');if(eid){var c2=S.cats.filter(function(x){return x.id===eid})[0];if(c2){c2.ess=t.checked;save()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

var installEvt=null;
function isPWAHost(){return !!document.querySelector('link[rel="manifest"]')}
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
try{window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;if(view==='more')render()});
  window.addEventListener('appinstalled',function(){installEvt=null;toast('Installed. Find it on your home screen.');if(view==='more')render()})}catch(e){}
var dl=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(function(x){dl=x},function(){})}catch(e){}
load();render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
